[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-axi"
dynamic = ["version"]
description = "Agent-ergonomic CLI for Blender (AXI principles): TOON output, headless by default, optional live mode."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aunuun Jeffry Mahbuubi" }]
keywords = ["blender", "cli", "agent", "axi", "toon", "mcp", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/jeffrymahbuubi/blender-axi"
Repository = "https://github.com/jeffrymahbuubi/blender-axi"
Issues = "https://github.com/jeffrymahbuubi/blender-axi/issues"

[project.scripts]
blender-axi = "blender_axi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "blender_axi.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: needs a real Blender installation"]
